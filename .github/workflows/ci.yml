name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]' hatchling
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - run: promptsieve-eval
      - run: python -m build --no-isolation
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t promptsieve:test .
      - name: Smoke test
        run: |
          docker run -d --name promptsieve -p 127.0.0.1:8000:8000 \
            -e PROMPTSIEVE_PROXY_TOKEN=ci-proxy-placeholder \
            -e PROMPTSIEVE_OPENAI_API_KEY=ci-upstream-placeholder promptsieve:test
          trap 'docker rm -f promptsieve' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs promptsieve
          exit 1
